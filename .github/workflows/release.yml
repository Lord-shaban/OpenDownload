name: Publish container images
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  verified:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify release metadata
        run: python3 scripts/release-check.py
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          count=$(gh run list --repo "$GH_REPO" --commit "$GITHUB_SHA" --workflow ci.yml --status success --limit 1 --json databaseId --jq length)
          test "$count" -ge 1 || { echo "Run and pass CI for this commit before tagging a release."; exit 1; }
  images:
    needs: verified
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [api, web, egress, cloud]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image prefix
        id: prefix
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.component }}
          push: true
          tags: ${{ steps.prefix.outputs.name }}-${{ matrix.component }}:${{ github.ref_name }}
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.title=OpenDownload ${{ matrix.component }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
  pull-and-verify:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and run the published Compose images
        run: |
          export OD_IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          export OD_IMAGE_TAG="$GITHUB_REF_NAME"
          docker compose -f compose.yaml -f compose.release.yaml pull
          OD_FIXTURE_MODE=true docker compose -f compose.yaml -f compose.release.yaml up --no-build -d --wait
          python3 scripts/container-check.py
      - name: Compose diagnostics
        if: failure()
        run: docker compose logs --tail=80
      - name: Stop Compose before the real cloud check
        if: always()
        run: docker compose down -v
      - name: Pull and verify real media in the published cloud image
        env:
          OD_TEST_MEDIA_REF: ${{ github.sha }}
        run: |
          export OD_CLOUD_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-cloud:$GITHUB_REF_NAME"
          docker pull "$OD_CLOUD_IMAGE"
          sudo apparmor_parser -r deploy/apparmor-cloud
          python3 scripts/cloud-check.py
