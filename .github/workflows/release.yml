name: Publish container images
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  verified:
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          count=$(gh run list --repo "$GH_REPO" --commit "$GITHUB_SHA" --workflow ci.yml --status success --limit 1 --json databaseId --jq length)
          test "$count" -ge 1 || { echo "Run and pass CI for this commit before tagging a release."; exit 1; }
  images:
    needs: verified
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [api, web, egress]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image prefix
        id: prefix
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.component }}
          push: true
          tags: ${{ steps.prefix.outputs.name }}-${{ matrix.component }}:${{ github.ref_name }}
          provenance: true
          sbom: true
