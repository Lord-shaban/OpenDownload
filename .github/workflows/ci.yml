name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: test -z "$(gofmt -l services/api)"
      - run: go -C services/api vet ./...
      - run: go -C services/api test -race -count=1 ./...
      - name: Go dependency audit
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd services/api
          govulncheck ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: pnpm audit --prod --audit-level high
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache-dependency-path: services/api/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e
        env:
          OD_FIXTURE_MODE: true
          NEXT_TELEMETRY_DISABLED: 1
      - name: Build containers and verify egress isolation
        run: |
          docker compose build
          OD_FIXTURE_MODE=true docker compose up -d --wait
          python3 scripts/container-check.py
      - name: Diagnostics
        if: failure()
        run: docker compose logs --tail=80
      - if: always()
        run: docker compose down -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-evidence
          path: apps/web/test-results
          retention-days: 7
