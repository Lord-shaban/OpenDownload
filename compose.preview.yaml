name: opendownload-preview
services:
  preview:
    build:
      context: .
      dockerfile: deploy/Dockerfile.preview
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      OD_ORIGIN: ${OD_ORIGIN:-http://localhost:3000}
    volumes: [preview-data:/data]
    read_only: true
    tmpfs: ["/tmp:size=64m,uid=10001,gid=10001"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 96
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/v1/status').then(r=>r.json()).then(s=>process.exit(s.ready&&s.fixtureMode?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
volumes:
  preview-data: {}
