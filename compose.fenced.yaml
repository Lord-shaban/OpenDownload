name: opendownload-fenced
services:
  cloud:
    build:
      context: .
      dockerfile: deploy/Dockerfile.cloud
    environment:
      OD_ORIGIN: ${OD_ORIGIN:-http://localhost:3000}
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["media:/data"]
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=64m,uid=10001,gid=10001"]
    cap_drop: [ALL]
    # Nested unprivileged namespaces need a runtime profile that permits unshare.
    # These Docker settings are for local verification, not a privileged container.
    security_opt:
      [
        "no-new-privileges:true",
        "seccomp:unconfined",
        "apparmor:opendownload-cloud",
      ]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 96
    stop_grace_period: 20s
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/v1/status').then(async r=>{const s=await r.json();process.exit(r.ok&&s.ready&&!s.fixtureMode?0:1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
volumes:
  media: {}
